version: 2

models:
  - name: stg_shortages
    columns:
      - name: record_key
        data_tests: [not_null]
      - name: status
        data_tests:
          - accepted_values:
              arguments: {values: ['Current', 'To Be Discontinued', 'Resolved']}
      - name: initial_posting_date
        data_tests: [not_null]
    data_tests:
      - unique:
          arguments: {column_name: "record_key || cast(dt as varchar)"}

  - name: stg_ndc_products
    data_tests:
      - unique:
          arguments: {column_name: "product_ndc || cast(dt as varchar)"}
    columns:
      - name: product_key
        data_tests: [not_null]

  - name: stg_enforcement
    columns:
      - name: recall_number
        data_tests: [unique, not_null]
      - name: classification
        data_tests:
          - accepted_values:
              arguments: {values: ['Class I', 'Class II', 'Class III', 'Not Yet Classified']}
      - name: report_date
        data_tests: [not_null]

  - name: stg_warning_letters
    columns:
      - name: company_name
        data_tests: [not_null]

  - name: int_product_families
    columns:
      - name: product_ndc
        data_tests: [unique, not_null]
      - name: family_key
        data_tests: [not_null]

  - name: int_firms_normalized
    columns:
      - name: firm_key
        data_tests: [unique, not_null]

  - name: int_shortage_history
    columns:
      - name: record_key
        data_tests: [not_null]
    data_tests:
      - unique:
          arguments: {column_name: "record_key || cast(valid_from as varchar)"}

  - name: int_ndc_history
    data_tests:
      - unique:
          arguments: {column_name: "product_ndc || cast(valid_from as varchar)"}

  - name: int_shortage_to_family
    columns:
      - name: record_key
        data_tests: [unique, not_null]
      - name: method
        data_tests:
          - accepted_values:
              arguments: {values: ['package_ndc', 'openfda_ndc', 'name_form', 'unmatched']}

  - name: int_recall_match
    columns:
      - name: method
        data_tests:
          - accepted_values:
              arguments: {values: ['openfda_block', 'ndc_keyword', 'ndc_bare', 'firm_text', 'generic_name']}
      - name: match_level
        data_tests:
          - accepted_values:
              arguments: {values: ['product', 'ingredient']}

  - name: int_shortage_episodes
    columns:
      - name: episode_key
        data_tests: [unique, not_null]
