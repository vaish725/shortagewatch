name: ci

on:
  pull_request:
  push:
    branches: [main]
  # Rebuild and test the warehouse after every pipeline run so new snapshots are checked too
  workflow_run:
    workflows: [daily-pipeline]
    types: [completed]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  warehouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # dbt reads the dated snapshots straight from the data branch
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data-branch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,warehouse,analysis]"
      - name: Pull recalls (openFDA keeps the full history, so they are not stored on the data branch)
        run: python -m ingestion.sources.enforcement
        env:
          OPENFDA_API_KEY: ${{ secrets.OPENFDA_API_KEY }}
      - name: Python recall match (reference numbers for the parity test)
        run: python -m ingestion.recall_match
        env:
          NDC_SNAPSHOT_DIR: data-branch/snapshots/ndc
      - name: Source freshness
        working-directory: warehouse
        run: dbt source freshness
      - name: dbt build (models, tests, unit tests, parity)
        working-directory: warehouse
        run: dbt build
      - name: Rebuild check and Python tests
        run: pytest -q
      # Re-fits the models on the latest snapshots as a smoke test. Weights in the repo are only changed by a
      # deliberate local run, so a drifting estimate does not fail the build.
      - name: Analysis (models, precision, duration, validation)
        run: make analysis PY=python
      - name: Generate dbt docs (single file)
        working-directory: warehouse
        run: dbt docs generate --static
      - uses: actions/upload-artifact@v4
        with:
          name: dbt-docs
          path: warehouse/target/static_index.html
      - name: Data quality metrics
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import duckdb
          rows = duckdb.connect("warehouse/target/shortagewatch.duckdb", read_only=True).sql(
              "select area, metric, round(value, 4), detail from mart_data_quality order by area, metric").fetchall()
          print("### Data quality\n\n| Area | Metric | Value | Detail |\n|---|---|---|---|")
          for r in rows:
              print("| " + " | ".join("" if v is None else str(v) for v in r) + " |")
          PY

  # Site layout: / is reserved for the dashboard, /dbt-docs/ holds the dbt documentation.
  docs:
    needs: warehouse
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    concurrency: pages
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dbt-docs
          path: dl
      - name: Assemble site
        run: |
          mkdir -p site/dbt-docs
          cp dl/static_index.html site/dbt-docs/index.html
          printf '<!doctype html><meta charset="utf-8"><title>ShortageWatch</title><p>ShortageWatch dashboard coming soon. <a href="dbt-docs/">Data model documentation</a></p>' > site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
