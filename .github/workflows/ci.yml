name: ci

on:
  pull_request:
  push:
    branches: [main]
  # Rebuild and test the warehouse after every pipeline run so new snapshots are checked too
  workflow_run:
    workflows: [daily-pipeline]
    types: [completed]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  warehouse:
    # After a pipeline run, rebuild only when that run succeeded, so a failed run leaves the last good site in place
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # dbt reads the dated snapshots straight from the data branch
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data-branch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,warehouse,analysis]"
      - name: Pull recalls (openFDA keeps the full history, so they are not stored on the data branch)
        run: python -m ingestion.sources.enforcement
        env:
          OPENFDA_API_KEY: ${{ secrets.OPENFDA_API_KEY }}
      - name: Python recall match (reference numbers for the parity test)
        run: python -m ingestion.recall_match
        env:
          NDC_SNAPSHOT_DIR: data-branch/snapshots/ndc
      - name: Source freshness
        working-directory: warehouse
        run: dbt source freshness
      - name: dbt build (models, tests, unit tests, parity)
        working-directory: warehouse
        run: dbt build
      - name: Rebuild check and Python tests
        run: pytest -q
      - name: Generate dbt docs (single file)
        working-directory: warehouse
        run: dbt docs generate --static
      - uses: actions/upload-artifact@v4
        with:
          name: dbt-docs
          path: warehouse/target/static_index.html
      - name: Export dashboard data
        run: python -m analysis.export_dashboard
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Build dashboard
        working-directory: dashboard
        run: |
          npm ci --no-audit --no-fund
          npm run sources
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-build
          path: dashboard/build
      - name: Data quality metrics
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import duckdb
          rows = duckdb.connect("warehouse/target/shortagewatch.duckdb", read_only=True).sql(
              "select area, metric, round(value, 4), detail from mart_data_quality order by area, metric").fetchall()
          print("### Data quality\n\n| Area | Metric | Value | Detail |\n|---|---|---|---|")
          for r in rows:
              print("| " + " | ".join("" if v is None else str(v) for v in r) + " |")
          PY

  # One deployment carries the whole site, because each Pages deployment replaces the previous one:
  # the dashboard at / and the dbt documentation at /dbt-docs/. Runs only when the warehouse job passed.
  site:
    needs: warehouse
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    concurrency: pages
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dashboard-build
          path: site
      - uses: actions/download-artifact@v4
        with:
          name: dbt-docs
          path: dl
      - name: Add dbt docs to the site
        run: |
          mkdir -p site/dbt-docs
          cp dl/static_index.html site/dbt-docs/index.html
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
