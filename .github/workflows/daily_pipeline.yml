name: daily-pipeline

on:
  schedule:
    - cron: "0 6 * * *"   # daily 06:00 UTC: shortage snapshot
    - cron: "30 6 * * 1"  # Mondays 06:30 UTC: recalls, NDC directory, warning letters
  workflow_dispatch:       # manual run executes both jobs

permissions:
  contents: write
  issues: write

jobs:
  # Kept as its own job so a failure in any other source can never leave a gap in shortage history
  shortages:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 6 * * *'
    runs-on: ubuntu-latest
    concurrency: data-branch-shortages
    steps:
      - uses: actions/checkout@v4
      # History lives on the data branch so it survives ephemeral CI runs
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data-branch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - name: Pull shortages feed
        run: python -m ingestion.sources.shortages
        env:
          OPENFDA_API_KEY: ${{ secrets.OPENFDA_API_KEY }}
      - name: Commit snapshot and run log to data branch
        if: always()
        run: |
          mkdir -p data-branch/snapshots data-branch/runs
          [ -d data/raw/shortages ] && cp -r data/raw/shortages data-branch/snapshots/
          [ -d data/runs ] && cp -r data/runs/. data-branch/runs/ || true
          .github/scripts/commit_to_data.sh "Shortage snapshot $(date -u +%F)" snapshots runs
      - name: Job summary
        if: always()
        run: python -m ingestion.run_summary >> "$GITHUB_STEP_SUMMARY"

  weekly:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 6 * * 1'
    runs-on: ubuntu-latest
    concurrency: data-branch-weekly
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data-branch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      # Each source runs on its own (always()) so one flaky source does not block the others;
      # the job still ends red if any step failed.
      - name: NDC directory
        run: python -m ingestion.sources.ndc
      - name: Recalls
        if: always()
        run: python -m ingestion.sources.enforcement
        env:
          OPENFDA_API_KEY: ${{ secrets.OPENFDA_API_KEY }}
      - name: Warning letters
        if: always()
        run: python -m ingestion.sources.warning_letters
      - name: Recall match rates
        if: always()
        run: python -m ingestion.recall_match
      # Only the NDC directory needs history (supplier counts at the right date); the other
      # sources carry their own dates and can be re-pulled in full, so they are not committed.
      - name: Commit NDC snapshot and run log to data branch
        if: always()
        run: |
          mkdir -p data-branch/snapshots data-branch/runs
          [ -d data/raw/ndc ] && cp -r data/raw/ndc data-branch/snapshots/ && rm -f data-branch/snapshots/ndc/*/quarantine.json
          [ -d data/runs ] && cp -r data/runs/. data-branch/runs/ || true
          .github/scripts/commit_to_data.sh "NDC snapshot $(date -u +%F)" snapshots runs
      - name: Job summary
        if: always()
        run: python -m ingestion.run_summary >> "$GITHUB_STEP_SUMMARY"

  # Opens (or comments on) an issue so failures reach the owner by email and stay visible in the repo
  alert:
    needs: [shortages, weekly]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Open failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Pipeline failure $(date -u +%F)"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number -q '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Another failure: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "A scheduled run failed: $RUN_URL"
          fi
