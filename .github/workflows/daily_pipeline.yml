name: daily-pipeline

on:
  schedule:
    - cron: "0 6 * * *"   # daily 06:00 UTC: shortage snapshot
    - cron: "30 6 * * 1"  # Mondays 06:30 UTC: recalls, NDC directory, warning letters
  workflow_dispatch:       # manual run executes both jobs

permissions:
  contents: write
  issues: write

jobs:
  # Kept as its own job so a failure in any other source can never leave a gap in shortage history
  shortages:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 6 * * *'
    runs-on: ubuntu-latest
    concurrency: data-branch-shortages
    steps:
      - uses: actions/checkout@v4
      # History lives on the data branch so it survives ephemeral CI runs
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data-branch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - name: Pull shortages feed
        run: python -m ingestion.sources.shortages
        env:
          OPENFDA_API_KEY: ${{ secrets.OPENFDA_API_KEY }}
      - name: Commit snapshot and run log to data branch
        if: always()
        run: |
          mkdir -p data-branch/snapshots data-branch/runs
          [ -d data/raw/shortages ] && cp -r data/raw/shortages data-branch/snapshots/
          [ -d data/runs ] && cp -r data/runs/. data-branch/runs/ || true
          .github/scripts/commit_to_data.sh "Shortage snapshot $(date -u +%F)" snapshots runs
      - name: Job summary
        if: always()
        run: python -m ingestion.run_summary >> "$GITHUB_STEP_SUMMARY"

  weekly:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 6 * * 1'
    runs-on: ubuntu-latest
    concurrency: data-branch-weekly
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data-branch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      # Each source runs on its own (always()) so one flaky source does not block the others;
      # the job still ends red if any step failed.
      - name: NDC directory
        id: ndc
        run: python -m ingestion.sources.ndc
      - name: Recalls
        id: recalls
        if: always()
        run: python -m ingestion.sources.enforcement
        env:
          OPENFDA_API_KEY: ${{ secrets.OPENFDA_API_KEY }}
      - name: Warning letters
        if: always()
        run: python -m ingestion.sources.warning_letters
      # Skipped, not computed on stale files, when either input failed to refresh
      - name: Recall match rates
        if: steps.ndc.outcome == 'success' && steps.recalls.outcome == 'success'
        run: python -m ingestion.recall_match
      # The NDC directory needs history (supplier counts at the right date). Warning letters come from a
      # fragile export whose older rows may disappear, so they are kept too. Recalls carry their own
      # dates and openFDA keeps that history, so they can be re-pulled in full.
      - name: Commit NDC and warning letter snapshots and run log to data branch
        if: always()
        run: |
          mkdir -p data-branch/snapshots data-branch/runs
          [ -d data/raw/ndc ] && cp -r data/raw/ndc data-branch/snapshots/
          [ -d data/raw/warning_letters ] && cp -r data/raw/warning_letters data-branch/snapshots/
          find data-branch/snapshots -name quarantine.json -delete
          [ -d data/runs ] && cp -r data/runs/. data-branch/runs/ || true
          .github/scripts/commit_to_data.sh "Weekly snapshots $(date -u +%F)" snapshots runs
      - name: Job summary
        if: always()
        run: python -m ingestion.run_summary >> "$GITHUB_STEP_SUMMARY"

  # Opens an issue on the first failure and comments on it for repeats, so failures reach the owner by email without piling up
  alert:
    needs: [shortages, weekly]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Open failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Pipeline failure"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number -q '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Failed again on $(date -u +%F): $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "A scheduled run failed on $(date -u +%F): $RUN_URL. Later failures are added as comments; close this issue once fixed."
          fi
